name: Import official FIRST season logos
on:
  push:
    paths:
      - 'scripts/import_season_logos.py'
      - '.github/workflows/import-season-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/import_season_logos.py
      - name: Commit current season approved logos and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'logos/FIRST Logos/2026-27/' logos/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Add official FIRST 2026-27 season logos to approved image gallery"
            git push
          fi
