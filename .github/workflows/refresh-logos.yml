name: Refresh transparent team logos and official FIRST assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_logos.py'
      - '.github/workflows/refresh-logos.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: pip install pillow numpy scipy requests
      - name: Replace logos using transparent backgrounds
        run: python scripts/refresh_logos.py
      - name: Commit replaced images and approved originals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/
          if ! git diff --cached --quiet; then
            git commit -m "Replace team logos with transparent PNGs and add unaltered FIRST assets"
            git push
          fi
