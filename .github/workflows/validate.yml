name: Validate standalone Button Studio
on:
  push:
    branches: [main, general-standalone-export]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.cjs
