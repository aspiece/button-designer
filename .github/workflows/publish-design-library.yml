name: Publish approved button designs
on:
  push:
    branches: [main]
    paths:
      - "designs/**"
      - "scripts/build_library.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and update design catalog
        run: python scripts/build_library.py
      - name: Commit regenerated catalog if changed
        run: |
          if ! git diff --quiet -- designs/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add designs/catalog.json
            git commit -m "Refresh approved button design catalog"
            git push
          fi
