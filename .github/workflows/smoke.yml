name: Button Studio smoke tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify editor, logos and PDF output
        run: node tests/smoke.cjs
      - name: Validate reusable GitHub design library files
        run: python3 scripts/build_library.py --validate

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save playwright-core
      - name: Test student workflow in Chrome
        run: node tests/browser-smoke.cjs
      - name: Keep button preview from browser test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button-browser-preview
          path: tests/browser-preview.png
          if-no-files-found: ignore
          retention-days: 7
